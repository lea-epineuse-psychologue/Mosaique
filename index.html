const pausePrompts=[["🤫","Éloigne-toi quelques instants du bruit ou des sollicitations. Tu peux fermer les yeux si tu le souhaites, ou simplement regarder un point fixe."],["🤸","Relâche les épaules, étire doucement les bras ou fais quelques pas. Reste dans une amplitude confortable."],["💧","Bois un verre d'eau ou prends une petite collation si tu en ressens le besoin."],["🌿","Détourne le regard de l'écran et regarde au loin. Laisse tes yeux se reposer."],["📝","Écris les pensées qui prennent de la place. Tu n'as pas besoin de les résoudre maintenant."],["🎵","Choisis un son agréable, une musique ou quelques instants de silence."]];
let pauseMinutes=1,pauseInterval=null,pauseRemaining=60,pauseSound=true;
function pausePage(){const choices=[["Silence","🤫","Réduire les stimulations"],["Bouger doucement","🤸","Délier le corps ou marcher"],["Boire / manger","💧","Prendre soin d'un besoin physique"],["Repos des yeux","🌿","Faire une pause des écrans"],["Décharger ma tête","📝","Noter ce qui tourne en boucle"],["Me reconnecter","🎵","Écouter un son agréable"]];app.innerHTML=header("Faire une pause","Une pause n'a pas besoin d'être productive. Choisis simplement ce qui pourrait te faire du bien maintenant.")+`<div class="card"><h3>De quoi aurais-tu besoin ?</h3><div class="pause-grid">${choices.map((x,i)=>`<button class="pause-option ${i===0?"selected":""}" onclick="choosePause(${i},this)"><span>${x[1]}</span><b>${x[0]}</b><small>${x[2]}</small></button>`).join("")}</div><div class="field"><label>Combien de temps peux-tu t'accorder ?</label><div class="toolbar pause-durations"><button class="chip active" onclick="setPauseTime(1,this)">1 min</button><button class="chip" onclick="setPauseTime(3,this)">3 min</button><button class="chip" onclick="setPauseTime(5,this)">5 min</button><button class="chip" onclick="setPauseTime(10,this)">10 min</button><button class="chip" onclick="setPauseTime(15,this)">15 min</button><button class="chip" onclick="setPauseTime(20,this)">20 min</button><button class="chip" onclick="showOtherPauseTime(this)">Autre durée</button></div><div id="otherPauseTime" class="field hidden"><label for="otherPauseMinutes">Autre durée (en minutes)</label><input id="otherPauseMinutes" type="number" min="1" max="180" step="1" placeholder="Ex. 8" oninput="setCustomPauseTime(this.value)"><small>Choisis entre 1 et 180 minutes.</small></div></div><div id="pausePrompt" class="story"><b>Un peu de calme</b><p>${pausePrompts[0][1]}</p></div><div class="pause-timer" id="pauseTimer">01:00</div><label class="pause-sound-choice"><input id="pauseSound" type="checkbox" checked onchange="pauseSound=this.checked"> 🔔 Me prévenir avec une sonnerie à la fin</label><p class="muted small">Attention : pour entendre la sonnerie, garde Mosaïque ouverte et laisse l'écran actif pendant ta pause. Si tu quittes l'application ou verrouilles ton téléphone, la sonnerie peut ne pas fonctionner.</p><div class="toolbar" style="justify-content:center"><button onclick="startPause()">Démarrer</button><button class="secondary" onclick="stopPause()">Réinitialiser</button></div></div>`}
function choosePause(i,el){document.querySelectorAll(".pause-option").forEach(x=>x.classList.remove("selected"));el.classList.add("selected");$("#pausePrompt").innerHTML=`<b>${["Un peu de calme","Un mouvement doux","Prendre soin de moi","Un repos visuel","Déposer les pensées","Un moment agréable"][i]}</b><p>${pausePrompts[i][1]}</p>`}
function setPauseTime(n,el){pauseMinutes=n;document.querySelectorAll(".pause-durations .chip").forEach(x=>x.classList.remove("active"));el.classList.add("active");$("#otherPauseTime").classList.add("hidden");pauseRemaining=n*60;updatePauseTimer()}
function showOtherPauseTime(el){document.querySelectorAll(".pause-durations .chip").forEach(x=>x.classList.remove("active"));el.classList.add("active");$("#otherPauseTime").classList.remove("hidden");$("#otherPauseMinutes").focus()}
function setCustomPauseTime(value){const n=Math.floor(Number(value));if(n>=1&&n<=180){pauseMinutes=n;pauseRemaining=n*60;updatePauseTimer()}}
function updatePauseTimer(){let e=$("#pauseTimer");if(e)e.textContent=String(Math.floor(pauseRemaining/60)).padStart(2,"0")+":"+String(pauseRemaining%60).padStart(2,"0")}
function stopPause(){if(pauseInterval)clearInterval(pauseInterval);pauseInterval=null;pauseRemaining=pauseMinutes*60;updatePauseTimer()}
function playPauseBell(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ctx=new AC();[0,0.28,0.56].forEach((delay)=>{const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type="sine";osc.frequency.value=880;gain.gain.setValueAtTime(0.0001,ctx.currentTime+delay);gain.gain.exponentialRampToValueAtTime(0.22,ctx.currentTime+delay+0.025);gain.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+delay+0.22);osc.connect(gain);gain.connect(ctx.destination);osc.start(ctx.currentTime+delay);osc.stop(ctx.currentTime+delay+0.24)});setTimeout(()=>ctx.close(),1200)}catch(e){}}
function startPause(){if(pauseInterval)clearInterval(pauseInterval);const other=$("#otherPauseMinutes");if(other&&!$("#otherPauseTime").classList.contains("hidden")){const n=Math.floor(Number(other.value));if(!(n>=1&&n<=180)){other.focus();return}pauseMinutes=n}pauseSound=$("#pauseSound")?$("#pauseSound").checked:pauseSound;pauseRemaining=pauseMinutes*60;updatePauseTimer();pauseInterval=setInterval(()=>{pauseRemaining--;updatePauseTimer();if(pauseRemaining<=0){clearInterval(pauseInterval);pauseInterval=null;$("#pausePrompt").innerHTML="<b>Ta pause est terminée.</b><p>Prends quelques secondes pour remarquer si quelque chose a changé. Tu peux prolonger si tu en as besoin.</p>";if(pauseSound)playPauseBell()}},1000)}
function ground(){const child=state.space==="child";const groups=[{id:"groundSee",n:5,icon:"👀",label:child?"5 choses que votre enfant voit":"5 choses que tu vois",hint:"Une chose par encadré"},{id:"groundTouch",n:4,icon:"✋",label:child?"4 choses que votre enfant peut toucher":"4 choses que tu peux toucher",hint:"Une chose par encadré"},{id:"groundHear",n:3,icon:"👂",label:child?"3 sons que votre enfant entend":"3 sons que tu entends",hint:"Un son par encadré"},{id:"groundSmell",n:2,icon:"🌿",label:child?"2 odeurs que votre enfant remarque":"2 odeurs que tu remarques",hint:"Une odeur par encadré"},{id:"groundFeel",n:1,icon:"💛",label:child?"1 sensation que votre enfant ressent":"1 sensation que tu ressens",hint:"Une sensation corporelle"}];app.innerHTML=header("Ancrage 5-4-3-2-1",child?"Un exercice à faire ensemble, à son rythme, pour revenir aux sensations présentes.":"Prends le temps de regarder autour de toi et de noter ce que tu perçois, sans te presser.")+`<div class="card"><p class="muted">${child?"Accompagnez votre enfant et proposez-lui de remplir un encadré à la fois. Vous pouvez l'aider à trouver des exemples, sans le presser.":"Écris une réponse dans chaque encadré. Il n'y a pas de bonne ou de mauvaise réponse : l'objectif est simplement de revenir à ce qui est présent, ici et maintenant."}</p>${groups.map(g=>`<section class="ground-group"><h3>${g.icon} ${g.label}</h3><div class="ground-inputs">${Array.from({length:g.n},(_,i)=>`<div class="ground-input"><label for="${g.id}${i+1}">${i+1}</label><input id="${g.id}${i+1}" type="text" autocomplete="off" placeholder="${g.hint}"></div>`).join("")}</div></section>`).join("")}<p class="note">${child?"Si une étape est difficile ou désagréable, vous pouvez la passer ou arrêter l'exercice.":"Si une sensation est désagréable ou si l'exercice ne te convient pas, tu peux passer une étape ou arrêter."}</p></div>`}
function appointmentPage(){app.innerHTML=header("Préparer un rendez-vous","Mettre ses questions et ses observations au clair avant une consultation.")+`<div class="card"><div class="field"><label>Professionnel / motif</label><input id="aname"></div><div class="field"><label>Ce qui m'amène</label><textarea id="areason"></textarea></div><div class="field"><label>Mes difficultés et leur impact</label><textarea id="aimpact"></textarea></div><div class="field"><label>Mes questions</label><textarea id="aquestions"></textarea></div><button onclick="addAppointment()">Enregistrer la préparation</button><button class="secondary" onclick="window.print()">Imprimer / enregistrer en PDF</button></div><div class="section"><h2>Préparations enregistrées</h2>${rec().appointments.slice().reverse().map(x=>`<div class="item"><b>${esc(x.name)}</b><p>${esc(x.reason)}</p><small>${x.date}</small></div>`).join("")||'<p class="muted">Aucune préparation.</p>'}</div>`}
function addAppointment(){rec().appointments.push({name:$("#aname").value,reason:$("#areason").value,impact:$("#aimpact").value,questions:$("#aquestions").value,date:new Date().toLocaleDateString("fr-FR")});save();appointmentPage()}
function plannerPage(){app.innerHTML=header("Organisation du quotidien","Fractionner les tâches, visualiser les étapes et prévoir les transitions.")+`<div class="card"><h3>Mon planning du jour</h3><div class="field"><label>Ajouter une étape</label><input id="task" placeholder="Ex. préparer le sac"></div><button onclick="addTask()">Ajouter</button><div class="section">${rec().tasks.map((t,i)=>`<div class="item"><label><input type="checkbox" onchange="checkTask(${i},this.checked)" ${t.done?"checked":""} style="width:auto"> ${esc(t.text)}</label></div>`).join("")||'<p class="muted">Votre planning est vide.</p>'}</div></div><div class="grid"><button class="tile" onclick="openChildTool('D’abord / ensuite')"><span class="ico">➡️</span><b>D'abord / ensuite</b></button><button class="tile" onclick="openChildTool('Planning visuel')"><span class="ico">🗓️</span><b>Planning visuel</b></button></div>`}
function addTask(){if($("#task").value){rec().tasks.push({text:$("#task").value,done:false});save();plannerPage()}}
function checkTask(i,v){rec().tasks[i].done=v;save()}
function programsPage(){app.innerHTML=header("Programmes et accompagnement","Des parcours progressifs à suivre à votre rythme. Ils ne remplacent pas un accompagnement professionnel.")+`<div class="grid">${[["Mieux comprendre mes émotions","2 semaines","Observer ses émotions, ses déclencheurs et ses besoins."],["Installer une routine de sommeil","2 semaines","Repérer son rythme et tester de petits ajustements."],["Mieux vivre avec le stress","3 semaines","Identifier les sources de tension et construire des pauses."],["Organisation pas à pas","3 semaines","Découper les tâches et expérimenter des repères."],["Comprendre mon fonctionnement","4 semaines","Explorer ses besoins, ressources et aménagements."]].map((p,i)=>`<div class="card"><span class="pill">${p[1]}</span><h3>${p[0]}</h3><p class="muted">${p[2]}</p><button class="secondary" onclick="showArticle('${p[0]}','${p[2]} Étape 1 : observer la situation. Étape 2 : choisir un petit objectif. Étape 3 : tester une stratégie. Étape 4 : faire le point et ajuster.')">Découvrir le parcours</button></div>`).join("")}</div>`}
function toolsPage(){app.innerHTML=header("Outils pratiques","Supports simples à utiliser au quotidien.")+`<div class="grid">${[["Minuteur","⏱️","Lancer un temps de concentration ou de pause."],["Pause motrice","🤸","Choisir un mouvement doux et adapté."],["Choix limité","🎯","Présenter deux options possibles."],["Carte de besoins","🪪","Dire ce qui aide : calme, temps, explication, pause."]].map(x=>`<button class="tile" onclick="showArticle('${x[0]}','${x[2]}')"><span class="ico">${x[1]}</span><b>${x[0]}</b></button>`).join("")}</div>`}
function openChildTool(t){if(["Planning visuel","Minuteur visuel","Tableau de motivation","D’abord / ensuite","D'abord / ensuite","Histoires sociales","Pictogrammes","Pauses motrices","Espace ado","Carte personnelle d'aide","Carte d'urgence","Relais aux proches","Démarches et dispositifs"].includes(t))return;trackUsage(t);app.innerHTML=header(t,"Outil de l'espace enfants et adolescents")+`<div class="card"><p>Un support à personnaliser avec l'enfant, l'adolescent et les adultes qui l'accompagnent.</p>${t==="Minuteur visuel"?`<div class="field"><label>Durée (minutes)</label><input id="mins" type="number" min="1" max="90" value="10"></div><div class="big" id="timer">10:00</div><button onclick="startTimer()">Démarrer</button>`:t==="D'abord / ensuite"?`<div class="field"><label>D'abord</label><input placeholder="Ex. ranger les jeux"></div><div class="field"><label>Ensuite</label><input placeholder="Ex. choisir une activité"></div>`:t==="Planning visuel"?`<p>Construisez une suite d'étapes simples et visibles.</p><div class="field"><label>Étapes (une par ligne)</label><textarea placeholder="Se lever&#10;S'habiller&#10;Prendre le petit-déjeuner"></textarea></div>`:t==="Tableau de motivation"?`<p>Choisissez un objectif concret, atteignable et valorisez l'effort.</p><input placeholder="Mon objectif"><p>☆ ☆ ☆ ☆ ☆</p>`:t==="Histoires sociales"?`<p>Une histoire sociale décrit une situation, ce qui peut se passer et les réponses possibles, sans imposer une réaction unique.</p><textarea placeholder="Ma situation / ce que je peux essayer"></textarea>`:t==="Pictogrammes"?`<div class="row">${["Pause","Aide","Encore","Stop","Oui","Non"].map(x=>`<button class="secondary">${x}</button>`).join("")}</div>`:`<p>Préparez un support personnel : mes signes d'alerte, ce qui m'aide, les personnes à contacter et les adaptations utiles.</p><textarea placeholder="Mes repères"></textarea>`}</div>`}
function startTimer(){let sec=Math.max(1,Number($("#mins").value))*60;let el=$("#timer");function tick(){if(!el)return;el.textContent=Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");if(sec-->0)setTimeout(tick,1000);else el.textContent="Terminé !"}tick()}
function crisisSupportContent(forChild=false){if(forChild)return `<h2>Votre enfant ne va pas bien : vous pouvez rester près de lui</h2><p><b>Accueillez ce qu’il ressent sans minimiser ni chercher tout de suite à résoudre la situation.</b> Vous pouvez lui dire : « Je vois que c’est très difficile en ce moment. Je suis là, on va chercher de l’aide ensemble. »</p><h3>S’il parle de se faire du mal ou de ne plus vouloir vivre</h3><p>Prenez ses paroles au sérieux, restez avec lui et demandez rapidement un avis. Vous pouvez appeler le <b>3114</b>, numéro national de prévention du suicide, gratuit, confidentiel, 24h/24 et 7j/7. Il est aussi destiné à l’entourage inquiet.</p><a class="crisis-call" href="tel:3114">☎ Appeler le 3114</a><details class="contact-details"><summary>✉️ Écrire plutôt qu'appeler</summary><div class="contact-links"><a href="https://www.filsantejeunes.com/tchat-individuel" target="_blank" rel="noopener"><b>Fil Santé Jeunes · Tchat</b><small>Pour les 12–25 ans · tous les jours, 9h–22h</small></a><a href="https://e-enfance.org/numero-3018/" target="_blank" rel="noopener"><b>3018 · Tchat et aide en ligne</b><small>Pour le harcèlement et les violences numériques</small></a><a href="https://www.allo119.gouv.fr/" target="_blank" rel="noopener"><b>119 · Allô enfance en danger</b><small>Pour signaler une situation de danger ou demander conseil</small></a><a href="https://www.urgence114.fr/" target="_blank" rel="noopener"><b>114 · Urgence par écrit</b><small>Pour contacter les secours par écrit si parler est impossible</small></a></div></details><div class="card section"><h3>Si vous êtes sourd·e ou malentendant·e</h3><p><b>114 · Urgence accessible</b> — service gratuit, 24h/24 et 7j/7, pour contacter les secours par SMS, tchat, visioconférence/LSF ou images. Il permet de joindre le SAMU, la police ou les pompiers sans passer par un appel vocal.</p><a class="crisis-call" href="https://www.info.urgence114.fr/" target="_blank" rel="noopener">Accéder au 114 · SMS, tchat ou visio</a><p><b>119 · Enfance en danger</b> — le site Allô 119 propose aussi un dispositif en langue des signes française, avec des horaires spécifiques indiqués sur le site.</p><a class="secondary" href="https://www.allo119.gouv.fr/" target="_blank" rel="noopener">Accéder au site Allô 119</a></div><h3>En cas de danger immédiat</h3><p>Ne laissez pas votre enfant seul. Si sa sécurité est immédiatement menacée, contactez les secours.</p><div class="crisis-emergency"><a href="tel:15">☎ SAMU · Appeler le 15</a><a href="tel:112">☎ Urgences · Appeler le 112</a></div>`;return `<h2>Tu n'as pas à rester seul·e avec ça</h2><p><b>Parle-en aujourd'hui à un adulte de confiance.</b> Tu peux lui dire simplement : « Je ne vais pas bien et j'ai besoin que tu restes avec moi. »</p><h3>Si tu penses à te faire du mal</h3><p>Appelle le <b>3114</b>, le numéro national de prévention du suicide. Gratuit, confidentiel, 24h/24 et 7j/7.</p><a class="crisis-call" href="tel:3114">☎ Appeler le 3114</a><details class="contact-details"><summary>✉️ Écrire plutôt qu'appeler</summary><div class="contact-links"><a href="https://www.filsantejeunes.com/tchat-individuel" target="_blank" rel="noopener"><b>Fil Santé Jeunes · Tchat</b><small>Pour les 12–25 ans · tous les jours, 9h–22h</small></a><a href="https://e-enfance.org/numero-3018/" target="_blank" rel="noopener"><b>3018 · Tchat et aide en ligne</b><small>Pour le harcèlement et les violences numériques</small></a><a href="https://www.allo119.gouv.fr/" target="_blank" rel="noopener"><b>119 · Tchat Allô enfance en danger</b><small>Pour les mineurs · tchat accessible selon les horaires indiqués sur le site</small></a><a href="https://www.urgence114.fr/" target="_blank" rel="noopener"><b>114 · Urgence par écrit</b><small>SMS et échanges écrits pour contacter les secours si tu ne peux pas parler, notamment en situation d'urgence</small></a></div></details><div class="card section"><h3>Si tu es sourd·e ou malentendant·e</h3><p><b>114 · Urgence accessible</b> — service gratuit, 24h/24 et 7j/7. Tu peux contacter les secours par SMS, tchat, visioconférence/LSF ou images, sans appel vocal.</p><a class="crisis-call" href="https://www.info.urgence114.fr/" target="_blank" rel="noopener">Accéder au 114 · SMS, tchat ou visio</a><p>Le <b>3114</b> est présenté plus haut comme un numéro d’écoute téléphonique. Si tu ne peux pas téléphoner et que tu es en danger immédiat, utilise le 114 pour joindre les services d’urgence.</p></div><h3>En cas de danger immédiat</h3><p>Si tu risques de te faire du mal maintenant, si tu t'es déjà blessé·e ou si tu ne peux pas rester en sécurité, contacte les secours tout de suite.</p><div class="crisis-emergency"><a href="tel:15">☎ SAMU · Appeler le 15</a><a href="tel:112">☎ Urgences · Appeler le 112</a></div>`}
function toggleCrisisPanel(){const panel=$("#crisis-inline"),btn=$("#crisis-entry");if(!panel)return;panel.classList.toggle("hidden");btn.setAttribute("aria-expanded",String(!panel.classList.contains("hidden")))}
function crisisPage(){const child=state.space==="child";app.innerHTML=header(child?"SOS · Mon enfant a besoin d'aide":"SOS · J'ai besoin d'aide",child?"Vous pouvez l'accompagner et demander du soutien.":"Tu n'as pas à traverser ça seul·e.")+`<div class="crisis-panel">${crisisSupportContent(child)}</div><div class="card section"><h3>Pour traverser les prochaines minutes</h3><p>Éloigne-toi si possible de ce qui augmente le danger et rapproche-toi d'une personne de confiance. Tu peux aussi choisir un endroit plus calme et essayer un ancrage sensoriel ou une respiration douce, sans te forcer.</p></div>`}
function sosPage(){const child=state.space==="child";app.innerHTML=header(child?"SOS · Mon enfant a besoin d'aide":"SOS · Moment difficile",child?"Quelques repères pour accompagner votre enfant lorsqu'il traverse un moment difficile.":"Des gestes simples et des contacts pour obtenir de l'aide.")+`<div class="card">${child?`<h3>1. Rester auprès de votre enfant</h3><p>Montrez-lui qu’il n’est pas seul. Si sa sécurité vous inquiète, ne le laissez pas seul.</p><h3>2. Accueillir ce qu’il ressent</h3><p>Écoutez sans juger, sans minimiser et sans le forcer à parler. Vous pouvez proposer simplement : « Je suis là. »</p><h3>3. Réduire les stimulations</h3><p>Proposez un endroit calme et limitez le bruit ou la lumière si cela l’aide.</p><h3>4. Chercher du soutien</h3><p>Si la situation vous inquiète, appuyez-vous sur un adulte de confiance ou un professionnel. En cas de danger immédiat, contactez les secours.</p>`:`<h3>1. Se mettre en sécurité</h3><p>Éloigne-toi si possible de ce qui augmente le danger et rejoins une personne de confiance.</p><h3>2. Réduire les stimulations</h3><p>Choisis un endroit plus calme, baisse le bruit ou la lumière si cela t'aide.</p><h3>3. Revenir au présent</h3><p>Essaie un ancrage sensoriel ou une respiration douce, sans te forcer.</p>`}</div><div class="crisis-panel section">${crisisSupportContent(child)}</div>`}
function helpPage(){app.innerHTML=header("Trouver de l'aide","Les services utiles en France, accessibles directement depuis Mosaïque.")+`<div class="card"><h3>Écoute et soutien</h3><div class="contact-links"><a href="tel:3114"><b>3114 · Prévention du suicide</b><small>Appeler gratuitement · 24h/24, 7j/7</small></a><a href="tel:0800235236"><b>Fil Santé Jeunes · 0800 235 236</b><small>12–25 ans · appel gratuit · 9h–23h</small></a><a href="https://www.filsantejeunes.com/tchat-individuel" target="_blank" rel="noopener"><b>Fil Santé Jeunes · Tchat</b><small>12–25 ans · 9h–22h</small></a><a href="https://e-enfance.org/numero-3018/" target="_blank" rel="noopener"><b>3018 · Harcèlement et violences numériques</b><small>Appel et accès aux solutions de tchat</small></a><a href="tel:119"><b>119 · Allô enfance en danger</b><small>Appel gratuit · 24h/24, 7j/7</small></a><a href="https://www.allo119.gouv.fr/" target="_blank" rel="noopener"><b>119 · Tchat et formulaire en ligne</b><small>Accès aux dispositifs en ligne</small></a></div></div><div class="card section"><h3>Urgences</h3><div class="contact-links"><a href="tel:15"><b>15 · SAMU</b><small>Urgence médicale</small></a><a href="tel:112"><b>112 · Urgences européennes</b><small>Numéro d'urgence</small></a><a href="sms:114"><b>114 · Envoyer un SMS aux secours</b><small>À utiliser si tu ne peux pas parler à voix haute en situation d’urgence</small></a><a href="https://www.urgence114.fr/" target="_blank" rel="noopener"><b>114 · Accès en ligne</b><small>SMS, tchat et autres modes de communication</small></a></div></div>`}
function settingsPage(){app.innerHTML=header("Mon espace et mes données","Gérer le code d'accès, exporter ses données et modifier ses profils.")+`<div class="card"><h3>Verrouiller l'ouverture de Mosaïque</h3><p class="muted">Si vous activez cette option, Mosaïque demandera le code à l'ouverture de l'application et lorsque vous y revenez après l'avoir quittée. Cela fonctionne aussi dans le navigateur. Le code est un verrou simple : il ne chiffre pas les données enregistrées sur l'appareil.</p><div class="field"><label>Nouveau code (4 chiffres)</label><input id="pin" inputmode="numeric" maxlength="4" placeholder="••••"></div><button onclick="setPin()">Enregistrer le code</button><label class="profile" style="margin-top:12px"><input id="lockOnOpen" type="checkbox" ${state.lockOnOpen?"checked":""} onchange="setLockOnOpen(this.checked)"><span>🔐</span><span><b>Demander le code à chaque ouverture / retour dans l'application</b><small>Vous pouvez désactiver cette demande à tout moment.</small></span></label><button class="secondary" onclick="removePin()">Désactiver le code</button></div><div class="card section"><h3>Données personnelles</h3><p class="muted">Les données saisies sont conservées dans le stockage local de ce navigateur. Elles ne sont pas synchronisées entre appareils. Effacer les données du navigateur peut les supprimer.</p><div class="toolbar"><button onclick="exportData()">Exporter mes données</button><label class="quiet" style="padding:10px;border-radius:12px">Importer<input type="file" accept="application/json" onchange="importData(event)" hidden></label><button class="danger" onclick="deleteData()">Tout supprimer</button></div></div><div class="card"><h3>Profils sélectionnés</h3><p>${state.selected.map(p=>`<span class="pill">${p}</span>`).join("")||"Aucun profil"}</p><button class="secondary" onclick="renderProfiles()">Modifier les profils</button></div><div class="card section"><h3>Changer d'espace</h3><p class="muted">Vous pouvez revenir au choix entre l'espace adulte / adolescent et l'espace enfant. Vos données actuelles resteront enregistrées sur cet appareil.</p><button class="secondary" onclick="switchSpace()">Changer d'espace</button></div>`}
function setPin(){let p=$("#pin").value;if(!/^\d{4}$/.test(p))return alert("Saisissez exactement quatre chiffres.");state.pin=p;state.unlocked=true;state.lockOnOpen=true;localStorage.setItem("mosaique_pin",p);localStorage.setItem("mosaique_lock_on_open","true");sessionStorage.setItem("mosaique_session_unlocked","1");alert("Code enregistré. Il sera demandé à la prochaine ouverture.");settingsPage()}
function setLockOnOpen(on){if(on&&!state.pin){alert("Définissez d’abord un code à quatre chiffres.");$("#lockOnOpen").checked=false;return}state.lockOnOpen=on;localStorage.setItem("mosaique_lock_on_open",String(on));settingsPage()}
function removePin(){localStorage.removeItem("mosaique_pin");localStorage.removeItem("mosaique_lock_on_open");sessionStorage.removeItem("mosaique_session_unlocked");state.pin="";state.lockOnOpen=false;state.unlocked=true;settingsPage()}
function exportData(){persistActiveProfile();const backup={app:"Mosaique",version:1,exportedAt:new Date().toISOString(),profile:{space:state.space,selected:state.selected,personName:state.personName||"",personAge:state.personAge||"",reminderChoice:state.reminderChoice||"no"},records:state.records};let blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="mosaique-sauvegarde.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{const restored=applyBackup(JSON.parse(r.result));alert("Import effectué. Votre espace et vos données ont été restaurés.");if(restored)dashboard()}catch{alert("Fichier non reconnu.")}};r.readAsText(f)}
function deleteData(){if(confirm("Supprimer toutes les données enregistrées sur cet appareil ?")){state.records={};save();dashboard()}}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function pinGate(){if(!state.pin||state.unlocked)return false;app.innerHTML=`<section class="hero center"><h1>Code d'accès</h1><p class="sub">Saisissez votre code à quatre chiffres.</p></section><div class="card"><input id="unlockPin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"><button style="width:100%;margin-top:12px" onclick="unlock()">Ouvrir mon espace</button></div>`;return true}
function unlock(){if($("#unlockPin").value===state.pin){state.unlocked=true;sessionStorage.setItem("mosaique_session_unlocked","1");home()}else alert("Code incorrect.")}

document.addEventListener("visibilitychange",()=>{
 if(document.visibilityState==="hidden"&&state.pin&&state.lockOnOpen){state.unlocked=false;sessionStorage.removeItem("mosaique_session_unlocked")}
 if(document.visibilityState==="visible"&&state.pin&&state.lockOnOpen&&!state.unlocked){pinGate()}
});
window.addEventListener("pageshow",()=>{
 if(state.pin&&state.lockOnOpen&&sessionStorage.getItem("mosaique_session_unlocked")!=="1"){state.unlocked=false;pinGate()}
});

try{restoreLegacyProfile();home()}catch(error){console.error("Mosaïque – erreur au démarrage :",error);app.innerHTML=`<section class="hero"><h1>Bienvenue dans Mosaïque</h1><p class="sub">Un petit problème a empêché le chargement de l'accueil.</p><button onclick="location.reload()">Recharger Mosaïque</button></section>`}
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script></body></html>
