<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6556a8"><meta name="description" content="Mosaïque, des repères et des outils au quotidien.">
<link rel="manifest" href="manifest.webmanifest"><title>Mosaïque</title>
<style>
:root{--ink:#29263a;--muted:#716d80;--bg:#f7f5fb;--card:#fff;--accent:#6556a8;--soft:#eeeafa;--line:#e8e4ef;--green:#e9f4ed;--radius:20px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px 16px;background:var(--accent);color:white;font-weight:650}.secondary{background:var(--soft);color:var(--accent)}.quiet{background:transparent;color:var(--accent);border:1px solid var(--line)}.danger{background:#a43c55}.wrap{max-width:1000px;margin:auto;padding:22px 18px 80px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.brand{font-size:21px;font-weight:850;letter-spacing:-.5px}.brand span{color:var(--accent)}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);font-weight:750}.hero{padding:28px 0 22px}.hero h1{font-size:clamp(30px,6vw,48px);line-height:1.08;letter-spacing:-1.5px;margin:8px 0 12px}.sub{color:var(--muted);max-width:680px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 5px 22px #34245d08}.choice{min-height:150px;text-align:left;color:var(--ink);background:white;border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;justify-content:center}.choice .emoji{font-size:30px}.choice strong{font-size:19px}.choice small{font-weight:450;color:var(--muted)}.profile{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}.profile input{width:19px;height:19px;accent-color:var(--accent);margin-top:3px}.profile label{flex:1}.profile small{display:block;color:var(--muted)}.section{margin:28px 0}.section h2{font-size:23px;letter-spacing:-.5px;margin:0 0 14px}.tile{display:flex;gap:14px;align-items:center;text-align:left;color:var(--ink);background:#fff;border:1px solid var(--line);padding:16px;border-radius:16px;width:100%;min-height:82px}.tile .ico{width:42px;height:42px;display:grid;place-items:center;background:var(--soft);border-radius:13px;font-size:21px}.tile small{display:block;color:var(--muted);font-weight:450}.tile b{display:block}.tile .arrow{margin-left:auto;color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar button{padding:9px 13px}.back{background:transparent;color:var(--accent);padding:8px 0}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;font-weight:700;color:var(--muted)}input,textarea,select{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}textarea{min-height:100px;resize:vertical}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.note{background:#fff8e9;border:1px solid #f2e5c8;border-radius:14px;padding:13px;color:#65532c;font-size:13px}.muted{color:var(--muted)}.pill{display:inline-block;background:var(--soft);color:var(--accent);padding:5px 10px;border-radius:30px;font-size:12px;font-weight:700;margin:3px}.item{border-bottom:1px solid var(--line);padding:12px 0}.item:last-child{border:0}.hidden{display:none!important}.big{font-size:40px;font-weight:800;text-align:center}.center{text-align:center}.footer{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px max(16px,calc((100vw - 960px)/2));display:flex;justify-content:space-between;gap:8px}.footer button{font-size:12px;padding:9px 12px}.chip{border:1px solid var(--line);border-radius:99px;padding:8px 12px;background:white;color:var(--ink)}.chip.active{background:var(--accent);color:white}.story{background:#f4f0ff;border-radius:16px;padding:18px}.small{font-size:12px}.list{padding-left:20px}.list li{margin:7px 0}
</style></head>
<body><div class="wrap">
<header class="top"><div class="brand">✳ <span>Mosaïque</span></div><div id="topRight" class="toolbar"></div></header>
<main id="app"></main></div><nav id="footer" class="footer hidden"></nav>
<script>
const $=s=>document.querySelector(s);
const app=$("#app");
const profiles=[
["TSA","Autisme, particularités sensorielles, communication et prévisibilité","🧩"],
["TDAH","Attention, impulsivité, organisation et fonctions exécutives","⚡"],
["Gestion des émotions","Identifier, comprendre et réguler les émotions","💗"],
["Anxiété","Inquiétudes, évitement et stratégies d'apaisement","🌿"],
["Sommeil","Rythmes, endormissement et qualité du sommeil","🌙"],
["Stress","Pression, surcharge et récupération","☁️"],
["Hypersensibilités","Besoins sensoriels et aménagements","🎧"],
["Confiance en soi","Estime de soi, compétences et affirmation","🌱"],
["Autres difficultés","Besoins et ressources complémentaires","✨"]
];
const common=[
["Sommeil","🌙","Journal du sommeil, routines et repères"],
["Gestion des émotions","💗","Journal émotionnel, météo intérieure et stratégies"],
["Santé et suivi des difficultés","🩺","Suivi personnel, symptômes et traitements"],
["Bien-être","🌿","Respiration, ancrage, relaxation et ressources"],
["Rendez-vous","📅","Préparer une consultation et garder une trace"],
["Organisation du quotidien","🗓️","Routines, planning et séquençage des tâches"],
["Programmes et accompagnement","🧭","Parcours guidés et objectifs progressifs"],
["Fiches de psychoéducation","📚","Comprendre, repérer et expérimenter"],
["Outils pratiques","🧰","Minuteur, pause, ancrage et supports visuels"],
["Mon espace et mes données","⚙️","Profils, préférences, export et confidentialité"]
];
const tailored={
"TSA":[["Comprendre le TSA","Le TSA est un trouble du neurodéveloppement. Les profils sont très variés : les besoins, les forces et les difficultés diffèrent d'une personne à l'autre."],["Surcharge sensorielle","Une surcharge peut apparaître lorsque les stimulations dépassent les capacités de traitement du moment. Repérer les signes précoces aide à prévoir une pause ou un aménagement."],["Prévisibilité et changements","Les repères visuels, l'annonce des transitions et la préparation des changements peuvent rendre certaines situations plus compréhensibles et moins coûteuses."],["Communication et interactions","Les façons de communiquer sont diverses. Le besoin de temps, la communication écrite ou les supports visuels peuvent faciliter les échanges."],["Récupération et besoins","Les temps de récupération, les intérêts spécifiques et les aménagements adaptés participent au bien-être."]],
"TDAH":[["Comprendre le TDAH","Le TDAH est un trouble du neurodéveloppement qui peut concerner l'attention, l'impulsivité et/ou l'hyperactivité. Les manifestations varient selon les personnes et les contextes."],["Fonctions exécutives","Planifier, commencer une tâche, maintenir son effort, gérer le temps et s'organiser peuvent demander davantage d'énergie. Externaliser les étapes peut aider."],["Attention et distractibilité","L'attention fluctue selon l'intérêt, la fatigue, l'environnement et la charge cognitive. Réduire les distracteurs et fractionner les tâches peut être utile."],["Motivation et démarrage","Un premier pas très court, un objectif visible et un renforcement immédiat peuvent faciliter le démarrage."],["Impulsivité et régulation","Créer un temps de pause entre l'envie et l'action, repérer les déclencheurs et préparer des stratégies alternatives peut soutenir l'autorégulation."]],
"Gestion des émotions":[["À quoi servent les émotions ?","Les émotions transmettent des informations sur nos besoins et notre environnement. Aucune émotion n'est mauvaise en soi."],["Identifier ce que je ressens","Nommer l'émotion, observer les sensations corporelles et évaluer son intensité aide à mieux comprendre ce qui se passe."],["Déclencheurs et besoins","Une émotion peut signaler un besoin de repos, de sécurité, de lien, de contrôle ou de reconnaissance."],["Revenir au calme","Respiration lente, ancrage sensoriel, mouvement ou retrait temporaire peuvent aider selon la personne et la situation."]],
"Anxiété":[["Comprendre l'anxiété","L'anxiété est une réponse d'alerte. Elle devient problématique lorsqu'elle est intense, durable ou qu'elle limite fortement le quotidien."],["Le cercle de l'évitement","Éviter soulage souvent à court terme, mais peut entretenir la peur. Une exposition graduée et accompagnée peut aider."],["Inquiétudes et pensées","Distinguer faits, hypothèses et scénarios redoutés permet de prendre du recul sans chercher à supprimer toutes les pensées."],["Stratégies d'apaisement","Respiration, ancrage, résolution de problème et soutien social sont des pistes à adapter à ses besoins."]],
"Sommeil":[["Comprendre le sommeil","Le sommeil dépend de nombreux facteurs : rythmes, environnement, santé, habitudes et stress. Un journal aide à repérer des tendances."],["Rituel du coucher","Une routine régulière et réaliste, adaptée à l'âge et au rythme de vie, peut faciliter la transition vers le sommeil."]],
"Stress":[["Comprendre le stress","Le stress mobilise des ressources face à une demande. La récupération et l'ajustement des contraintes sont aussi importants que les stratégies individuelles."]],
"Hypersensibilités":[["Comprendre les particularités sensorielles","Les réactions aux sons, lumières, textures, odeurs ou mouvements peuvent être différentes d'une personne à l'autre. L'objectif est d'identifier les besoins et les aménagements utiles."]],
"Confiance en soi":[["Estime de soi et compétences","La confiance se construit aussi en identifiant ses réussites, ses efforts, ses besoins et ses ressources, sans se réduire à ses difficultés."]],
"Autres difficultés":[["Partir de ses besoins","Décrire une situation concrète, son impact et ce qui aide constitue un premier repère pour choisir des stratégies adaptées."]]
};
let state={space:null,selected:[],page:"home",section:null,records:JSON.parse(localStorage.getItem("mosaique_records")||"{}"),pin:localStorage.getItem("mosaique_pin")||"",unlocked:!localStorage.getItem("mosaique_pin")};
function save(){localStorage.setItem("mosaique_records",JSON.stringify(state.records))}
function current(){return state.space==="child"?"enfant":"adulte"}
function profileKey(){return current()+":"+state.selected.join("|")}
function rec(){return state.records[profileKey()]||(state.records[profileKey()]={journal:[],sleep:[],health:[],appointments:[],tasks:[],goals:[],daily:[],favorites:[],help:[]})}
function header(title,desc){return `<button class="back" onclick="goDash()">← Tableau de bord</button><div class="hero"><div class="eyebrow">${state.space==="child"?"Espace enfants":"Espace adultes"}</div><h1>${title}</h1><p class="sub">${desc||""}</p></div>`}
function home(){if(pinGate())return;state.page="home";$("#footer").classList.add("hidden");app.innerHTML=`<section class="hero"><div class="eyebrow">Des repères et des outils au quotidien</div><h1>Bienvenue dans<br><span style="color:var(--accent)">Mosaïque</span></h1><p class="sub">Un espace personnalisable pour mieux comprendre ses besoins, suivre son quotidien et trouver des outils adaptés.</p></section><div class="grid"><button class="choice" onclick="chooseSpace('child')"><span class="emoji">🧸</span><strong>Espace enfants</strong><small>Des outils adaptés aux enfants, aux adolescents et à leurs accompagnants.</small></button><button class="choice" onclick="chooseSpace('adult')"><span class="emoji">🌿</span><strong>Espace adultes</strong><small>Des repères et des outils adaptés à la vie adulte.</small></button></div><p class="note" style="margin-top:18px">Mosaïque est un outil de soutien et d'information. Il ne remplace pas un avis, un diagnostic ou un accompagnement par un professionnel.</p>`}
function chooseSpace(s){state.space=s;state.page="profiles";renderProfiles()}
function renderProfiles(){state.page="profiles";$("#footer").classList.add("hidden");app.innerHTML=`<button class="back" onclick="home()">← Retour</button><section class="hero"><div class="eyebrow">Étape 2 · Personnalisation</div><h1>Quel profil souhaitez-vous explorer ?</h1><p class="sub">Sélectionnez un ou plusieurs profils. Un diagnostic n'est pas nécessaire pour utiliser les outils. Vous pourrez modifier vos choix plus tard.</p></section><div class="grid">${profiles.map((p,i)=>`<label class="profile"><input type="checkbox" value="${p[0]}" ${state.selected.includes(p[0])?"checked":""} onchange="toggleProfile('${p[0]}',this.checked)"><span>${p[2]}</span><label><b>${p[0]}</b><small>${p[1]}</small></label></label>`).join("")}</div><div class="row" style="margin-top:20px"><button onclick="dashboard()">Accéder à mon tableau de bord →</button><button class="secondary" onclick="state.selected=[];dashboard()">Continuer sans profil</button></div>`}
function toggleProfile(p,on){state.selected=on?[...state.selected,p]:state.selected.filter(x=>x!==p)}
function dashboard(){
 state.page="dashboard";const today=new Date().toISOString().slice(0,10),d=rec(),q=d.daily.find(x=>x.date===today);
 app.innerHTML=`<section class="hero"><div class="eyebrow">${state.space==="child"?"Espace enfants":"Espace adultes"}</div><div class="eyebrow" style="font-size:15px;color:var(--accent);margin-top:12px">QUOTIDIEN</div><h1>Votre tableau de bord</h1><p class="sub">Votre espace personnel pour faire le point et retrouver vos outils.</p><div>${state.selected.map(p=>`<span class="pill">${p}</span>`).join("")||'<span class="pill">Sans profil</span>'}</div><button class="quiet" style="margin-top:12px" onclick="renderProfiles()">Modifier mes profils</button></section>
 <section class="section"><h2>Moi, aujourd'hui</h2><div class="card"><p class="muted">Comment je me sens aujourd'hui ?</p><div class="field"><label>Mon humeur (1 = très difficile · 5 = très bonne)</label><div class="row">${[1,2,3,4,5].map(n=>`<button class="chip ${q&&+q.mood===n?'active':''}" onclick="setDaily('mood',${n})">${n}</button>`).join("")}</div></div><div class="field"><label>Mon stress (1 = très faible · 5 = très élevé)</label><div class="row">${[1,2,3,4,5].map(n=>`<button class="chip ${q&&+q.stress===n?'active':''}" onclick="setDaily('stress',${n})">${n}</button>`).join("")}</div></div><div class="field"><label>Est-ce que j'ai passé une bonne journée ?</label><div class="row">${["Oui","Moyennement","Non"].map(v=>`<button class="chip ${q&&q.day===v?'active':''}" onclick="setDaily('day','${v}')">${v}</button>`).join("")}</div></div><div class="field"><label>Une petite note (facultatif)</label><textarea id="dailyNote" placeholder="Ce que j'aimerais retenir…">${q?esc(q.note):""}</textarea></div><button onclick="saveDailyNote()">Enregistrer mon bilan</button></div></section>
 <section class="section"><h2>Mes 14 derniers relevés</h2><div class="card">${d.daily.slice().sort((x,y)=>y.date.localeCompare(x.date)).slice(0,14).map(x=>`<div class="item"><b>${x.date}</b><p class="muted">Humeur : ${x.mood||"—"}/5 · Stress : ${x.stress||"—"}/5 · Journée : ${x.day||"—"}</p></div>`).join("")||'<p class="muted">Tes relevés apparaîtront ici au fil des jours.</p>'}</div></section>
 <section class="section"><h2>Mes fiches enregistrées ♥</h2><div class="card">${d.favorites.map(f=>`<div class="item"><b>${esc(f.title)}</b><button class="quiet" onclick="showArticle('${esc(f.title)}','${esc(f.body)}')">Lire</button> <button class="quiet" onclick="unfavorite('${esc(f.title)}')">Retirer</button></div>`).join("")||'<p class="muted">Ajoute un cœur aux fiches que tu souhaites retrouver ici.</p>'}</div></section>
 <section class="section"><h2>Besoin d'aide ?</h2><div class="grid"><button class="tile" onclick="sosPage()"><span class="ico">🆘</span><span><b>SOS · Moment difficile</b><small>Des repères pour traverser une crise.</small></span></button><button class="tile" onclick="helpPage()"><span class="ico">🤝</span><span><b>Trouver de l'aide</b><small>Contacts et services utiles.</small></span></button></div></section>
 <section class="section"><h2>Toutes les rubriques</h2><div class="grid">${common.map((x,i)=>`<button class="tile" onclick="openSection(${i})"><span class="ico">${x[1]}</span><span><b>${x[0]}</b><small>${x[2]}</small></span><span class="arrow">›</span></button>`).join("")}</div></section>
 ${state.space==="child"?`<section class="section"><h2>Outils enfants et adolescents</h2><div class="grid">${[["Planning visuel","🗓️"],["Minuteur visuel","⏱️"],["Tableau de motivation","⭐"],["D'abord / ensuite","➡️"],["Histoires sociales","📖"],["Pictogrammes","🗣️"],["Pauses motrices","🤸"],["Espace ado","🎧"],["Carte personnelle d'aide","🪪"],["Carte d'urgence","🆘"],["Relais aux proches","🤝"],["Démarches et dispositifs","🧾"]].map(x=>`<button class="tile" onclick="openChildTool('${x[0]}')"><span class="ico">${x[1]}</span><b>${x[0]}</b></button>`).join("")}</div></section>`:""}`;
 footer();
}
function setDaily(k,v){let d=rec(),date=new Date().toISOString().slice(0,10),x=d.daily.find(z=>z.date===date);if(!x){x={date,mood:"",stress:"",day:"",note:""};d.daily.push(x)}x[k]=v;save();dashboard()}
function saveDailyNote(){let d=rec(),date=new Date().toISOString().slice(0,10),x=d.daily.find(z=>z.date===date);if(!x){x={date,mood:"",stress:"",day:"",note:""};d.daily.push(x)}x.note=$("#dailyNote").value;save();dashboard()}
function favorite(title,body){let d=rec();if(!d.favorites.some(x=>x.title===title))d.favorites.push({title,body});save();fiches()}
function unfavorite(title){let d=rec();d.favorites=d.favorites.filter(x=>x.title!==title);save();dashboard()}
function sosPage(){app.innerHTML=header("SOS · Moment difficile","Quelques repères pour traverser un moment difficile.")+`<div class="card"><h3>1. Se mettre en sécurité</h3><p>Éloignez-vous si possible de ce qui augmente le danger et rejoignez une personne de confiance.</p><h3>2. Réduire les stimulations</h3><p>Choisissez un endroit plus calme, baissez le bruit ou la lumière si cela vous aide.</p><h3>3. Revenir au présent</h3><p>Essayez un ancrage sensoriel ou une respiration douce, sans vous forcer.</p><h3>4. Demander du soutien</h3><p>En cas de danger immédiat en France : 15 ou 112. En cas de pensées suicidaires : 3114, gratuit, 24h/24.</p><button class="secondary" onclick="helpPage()">Trouver de l'aide</button></div>`}
function helpPage(){app.innerHTML=header("Trouver de l'aide","Rassembler les contacts utiles et les ressources d'urgence.")+`<div class="card"><h3>Mes personnes ressources</h3><div class="field"><label>Nom / rôle</label><input id="helpName" placeholder="Personne de confiance, professionnel…"></div><div class="field"><label>Téléphone / contact</label><input id="helpPhone"></div><button onclick="saveHelp()">Ajouter</button>${(rec().help||[]).map(x=>`<div class="item"><b>${esc(x.name)}</b><p>${esc(x.phone)}</p></div>`).join("")}</div><div class="card section"><h3>Services utiles en France</h3><p><b>15 ou 112 :</b> urgence médicale / européenne.</p><p><b>17 :</b> police · <b>18 :</b> pompiers.</p><p><b>3114 :</b> prévention du suicide, gratuit 24h/24.</p><p><b>119 :</b> enfance en danger.</p></div>`}
function saveHelp(){let d=rec();d.help=d.help||[];d.help.push({name:$("#helpName").value,phone:$("#helpPhone").value});save();helpPage()}
function footer(){$("#footer").classList.remove("hidden");$("#footer").innerHTML=`<button class="secondary" onclick="dashboard()">⌂ Quotidien</button><button class="secondary" onclick="sosPage()">🆘 SOS</button><button class="secondary" onclick="helpPage()">🤝 Aide</button><button class="secondary" onclick="openSection(9)">⚙️ Paramètres</button>`}
function goDash(){dashboard()}
function openSection(i){state.section=i;let name=common[i][0];state.page="section";if(i===7)return fiches();if(i===0)return sleepPage();if(i===1)return emotionPage();if(i===2)return healthPage();if(i===3)return wellbeingPage();if(i===4)return appointmentPage();if(i===5)return plannerPage();if(i===6)return programsPage();if(i===8)return toolsPage();if(i===9)return settingsPage();app.innerHTML=header(name)}
function fiches(){state.page="fiches";app.innerHTML=header("Fiches de psychoéducation","Des fiches adaptées à l'âge et aux profils sélectionnés. Les ressources générales restent accessibles à tous.")+`<div class="section"><h2>Fiches générales</h2><div class="grid">${[["Comprendre ses besoins","Identifier les situations qui facilitent ou compliquent le quotidien."],["Prendre soin de soi","Repérer ses signaux de fatigue et prévoir des temps de récupération."],["Demander de l'aide","Préparer une demande claire et identifier les personnes ressources."]].map(f=>`<button class="tile" onclick="showArticle('${f[0]}','${f[1]}')"><span class="ico">📘</span><span><b>${f[0]}</b><small>${f[1]}</small></span></button>`).join("")}</div></div>${state.selected.map(p=>`<div class="section"><h2>Profil : ${p}</h2><div class="grid">${(tailored[p]||[]).map((f,j)=>`<button class="tile" onclick="showArticle('${f[0].replace(/'/g,"\\'")}','${f[1].replace(/'/g,"\\'")}')"><span class="ico">📖</span><span><b>${f[0]}</b><small>Lire la fiche</small></span><span class="arrow">›</span></button>`).join("")}</div></div>`).join("")||`<div class="card"><b>Choisissez un profil pour personnaliser vos fiches.</b><p class="muted">Vous pouvez le faire à tout moment depuis « Modifier mes profils ».</p><button class="secondary" onclick="renderProfiles()">Choisir mes profils</button></div>`}`}
function showArticle(t,d){app.innerHTML=header(t,"Fiche de psychoéducation")+`<article class="card"><p>${d}</p><p class="muted">À retenir : les expériences et besoins sont individuels. Essayez de repérer ce qui vous aide dans votre contexte, sans vous imposer une méthode unique.</p><div class="note">Cette fiche est informative et ne constitue pas une évaluation diagnostique ni une recommandation médicale individualisée.</div><button class="secondary" style="margin-top:16px" onclick="fiches()">Retour aux fiches</button></article>`}
function journalForm(){return `<div class="card"><h3>Mon journal émotionnel</h3><div class="field"><label>Date</label><input id="jdate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Émotion principale</label><select id="jemotion"><option>Joie</option><option>Tristesse</option><option>Colère</option><option>Peur / anxiété</option><option>Frustration</option><option>Fatigue</option><option>Calme</option><option>Autre</option></select></div><div class="field"><label>Intensité (0 à 10)</label><input id="jlevel" type="range" min="0" max="10" value="5"></div><div class="field"><label>Que s'est-il passé ? De quoi avais-je besoin ?</label><textarea id="jtext"></textarea></div><button onclick="addJournal()">Enregistrer l'entrée</button></div>`}
function emotionPage(){app.innerHTML=header("Gestion des émotions","Observer ses émotions, repérer ses besoins et identifier ce qui aide.")+journalForm()+`<div class="section"><h2>Mon historique</h2>${rec().journal.slice().reverse().map(x=>`<div class="item"><b>${x.date} · ${x.emotion}</b> <span class="pill">${x.level}/10</span><p>${esc(x.text)}</p></div>`).join("")||'<p class="muted">Aucune entrée pour le moment.</p>'}</div>`}
function addJournal(){rec().journal.push({date:$("#jdate").value,emotion:$("#jemotion").value,level:$("#jlevel").value,text:$("#jtext").value});save();emotionPage()}
function sleepPage(){app.innerHTML=header("Sommeil","Un journal simple pour repérer les habitudes et les facteurs associés au sommeil.")+`<div class="card"><h3>Ajouter une nuit</h3><div class="row"><div class="field"><label>Date</label><input id="sdate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Qualité (0 à 5)</label><input id="squality" type="number" min="0" max="5" value="3"></div></div><div class="row"><div class="field"><label>Heure du coucher</label><input id="sbed" type="time"></div><div class="field"><label>Heure du réveil</label><input id="swake" type="time"></div></div><div class="field"><label>Réveils / observations</label><textarea id="snote"></textarea></div><button onclick="addSleep()">Enregistrer</button></div><div class="section"><h2>Historique récent</h2>${rec().sleep.slice(-14).reverse().map(x=>`<div class="item"><b>${x.date}</b> · Qualité ${x.quality}/5 · ${x.bed||"—"} → ${x.wake||"—"}<p class="muted">${esc(x.note)}</p></div>`).join("")||'<p class="muted">Aucune nuit renseignée.</p>'}</div>`}
function addSleep(){rec().sleep.push({date:$("#sdate").value,quality:$("#squality").value,bed:$("#sbed").value,wake:$("#swake").value,note:$("#snote").value});save();sleepPage()}
function healthPage(){app.innerHTML=header("Santé et suivi des difficultés","Un espace de suivi personnel. N'interprète pas les symptômes et ne remplace pas un suivi médical.")+`<div class="card"><h3>Ajouter une observation</h3><div class="field"><label>Date</label><input id="hdate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Type de suivi</label><select id="htype"><option>Difficulté / symptôme</option><option>Traitement / prise</option><option>Énergie / fatigue</option><option>Alimentation</option><option>Tics / mouvements</option><option>Autre</option></select></div><div class="field"><label>Observation</label><textarea id="htext"></textarea></div><button onclick="addHealth()">Enregistrer</button></div><div class="section"><h2>Historique</h2>${rec().health.slice().reverse().map(x=>`<div class="item"><b>${x.date} · ${x.type}</b><p>${esc(x.text)}</p></div>`).join("")||'<p class="muted">Aucune observation.</p>'}</div>`}
function addHealth(){rec().health.push({date:$("#hdate").value,type:$("#htype").value,text:$("#htext").value});save();healthPage()}
function wellbeingPage(){app.innerHTML=header("Bien-être","Des exercices courts à choisir selon le moment et les préférences.")+`<div class="grid"><button class="tile" onclick="breath()"><span class="ico">🌬️</span><span><b>Respiration guidée</b><small>Un temps de respiration calme</small></span></button><button class="tile" onclick="ground()"><span class="ico">🌳</span><span><b>Ancrage 5-4-3-2-1</b><small>Revenir aux sensations présentes</small></span></button><button class="tile" onclick="showArticle('Pause et récupération','Choisissez une pause réaliste : réduire les stimulations, bouger doucement, boire de l’eau ou demander du soutien.')"><span class="ico">☕</span><span><b>Faire une pause</b><small>Repérer son besoin de récupération</small></span></button></div>`}
function breath(){app.innerHTML=header("Respiration guidée","Installez-vous confortablement. Ne forcez jamais votre respiration.")+`<div class="card center"><div class="big" id="breathText">Prêt·e ?</div><p id="breathHint" class="muted">Lancez un cycle doux : inspirez 4 secondes, expirez 6 secondes, selon votre confort.</p><button onclick="startBreath()">Commencer</button></div>`}
function startBreath(){let n=0;const t=$("#breathText"),h=$("#breathHint");function step(){if(!t)return;if(n>=6){t.textContent="Terminé";h.textContent="Prenez un instant pour observer comment vous vous sentez.";return}let inhale=n%2===0;t.textContent=inhale?"Inspirez":"Expirez";h.textContent=inhale?"Doucement, sans forcer · 4 secondes":"Laissez l'air sortir · 6 secondes";n++;setTimeout(step,inhale?4000:6000)}step()}
function ground(){app.innerHTML=header("Ancrage 5-4-3-2-1","Un exercice sensoriel. Adaptez-le ou arrêtez si cela ne vous convient pas.")+`<div class="card"><ol class="list"><li><b>5 choses</b> que vous voyez</li><li><b>4 choses</b> que vous pouvez toucher ou sentir sous vos doigts</li><li><b>3 sons</b> que vous entendez</li><li><b>2 odeurs</b> que vous remarquez</li><li><b>1 sensation</b> ou chose agréable à goûter / imaginer</li></ol></div>`}
function appointmentPage(){app.innerHTML=header("Préparer un rendez-vous","Mettre ses questions et ses observations au clair avant une consultation.")+`<div class="card"><div class="field"><label>Professionnel / motif</label><input id="aname"></div><div class="field"><label>Ce qui m'amène</label><textarea id="areason"></textarea></div><div class="field"><label>Mes difficultés et leur impact</label><textarea id="aimpact"></textarea></div><div class="field"><label>Mes questions</label><textarea id="aquestions"></textarea></div><button onclick="addAppointment()">Enregistrer la préparation</button><button class="secondary" onclick="window.print()">Imprimer / enregistrer en PDF</button></div><div class="section"><h2>Préparations enregistrées</h2>${rec().appointments.slice().reverse().map(x=>`<div class="item"><b>${esc(x.name)}</b><p>${esc(x.reason)}</p><small>${x.date}</small></div>`).join("")||'<p class="muted">Aucune préparation.</p>'}</div>`}
function addAppointment(){rec().appointments.push({name:$("#aname").value,reason:$("#areason").value,impact:$("#aimpact").value,questions:$("#aquestions").value,date:new Date().toLocaleDateString("fr-FR")});save();appointmentPage()}
function plannerPage(){app.innerHTML=header("Organisation du quotidien","Fractionner les tâches, visualiser les étapes et prévoir les transitions.")+`<div class="card"><h3>Mon planning du jour</h3><div class="field"><label>Ajouter une étape</label><input id="task" placeholder="Ex. préparer le sac"></div><button onclick="addTask()">Ajouter</button><div class="section">${rec().tasks.map((t,i)=>`<div class="item"><label><input type="checkbox" onchange="checkTask(${i},this.checked)" ${t.done?"checked":""} style="width:auto"> ${esc(t.text)}</label></div>`).join("")||'<p class="muted">Votre planning est vide.</p>'}</div></div><div class="grid"><button class="tile" onclick="openChildTool('D’abord / ensuite')"><span class="ico">➡️</span><b>D'abord / ensuite</b></button><button class="tile" onclick="openChildTool('Planning visuel')"><span class="ico">🗓️</span><b>Planning visuel</b></button></div>`}
function addTask(){if($("#task").value){rec().tasks.push({text:$("#task").value,done:false});save();plannerPage()}}
function checkTask(i,v){rec().tasks[i].done=v;save()}
function programsPage(){app.innerHTML=header("Programmes et accompagnement","Des parcours progressifs à suivre à votre rythme. Ils ne remplacent pas un accompagnement professionnel.")+`<div class="grid">${[["Mieux comprendre mes émotions","2 semaines","Observer ses émotions, ses déclencheurs et ses besoins."],["Installer une routine de sommeil","2 semaines","Repérer son rythme et tester de petits ajustements."],["Mieux vivre avec le stress","3 semaines","Identifier les sources de tension et construire des pauses."],["Organisation pas à pas","3 semaines","Découper les tâches et expérimenter des repères."],["Comprendre mon fonctionnement","4 semaines","Explorer ses besoins, ressources et aménagements."]].map((p,i)=>`<div class="card"><span class="pill">${p[1]}</span><h3>${p[0]}</h3><p class="muted">${p[2]}</p><button class="secondary" onclick="showArticle('${p[0]}','${p[2]} Étape 1 : observer la situation. Étape 2 : choisir un petit objectif. Étape 3 : tester une stratégie. Étape 4 : faire le point et ajuster.')">Découvrir le parcours</button></div>`).join("")}</div>`}
function toolsPage(){app.innerHTML=header("Outils pratiques","Supports simples à utiliser au quotidien.")+`<div class="grid">${[["Minuteur","⏱️","Lancer un temps de concentration ou de pause."],["Pause motrice","🤸","Choisir un mouvement doux et adapté."],["Choix limité","🎯","Présenter deux options possibles."],["Carte de besoins","🪪","Dire ce qui aide : calme, temps, explication, pause."]].map(x=>`<button class="tile" onclick="showArticle('${x[0]}','${x[2]}')"><span class="ico">${x[1]}</span><b>${x[0]}</b></button>`).join("")}</div>`}
function openChildTool(t){app.innerHTML=header(t,"Outil de l'espace enfants et adolescents")+`<div class="card"><p>Un support à personnaliser avec l'enfant, l'adolescent et les adultes qui l'accompagnent.</p>${t==="Minuteur visuel"?`<div class="field"><label>Durée (minutes)</label><input id="mins" type="number" min="1" max="90" value="10"></div><div class="big" id="timer">10:00</div><button onclick="startTimer()">Démarrer</button>`:t==="D'abord / ensuite"?`<div class="field"><label>D'abord</label><input placeholder="Ex. ranger les jeux"></div><div class="field"><label>Ensuite</label><input placeholder="Ex. choisir une activité"></div>`:t==="Planning visuel"?`<p>Construisez une suite d'étapes simples et visibles.</p><div class="field"><label>Étapes (une par ligne)</label><textarea placeholder="Se lever&#10;S'habiller&#10;Prendre le petit-déjeuner"></textarea></div>`:t==="Tableau de motivation"?`<p>Choisissez un objectif concret, atteignable et valorisez l'effort.</p><input placeholder="Mon objectif"><p>☆ ☆ ☆ ☆ ☆</p>`:t==="Histoires sociales"?`<p>Une histoire sociale décrit une situation, ce qui peut se passer et les réponses possibles, sans imposer une réaction unique.</p><textarea placeholder="Ma situation / ce que je peux essayer"></textarea>`:t==="Pictogrammes"?`<div class="row">${["Pause","Aide","Encore","Stop","Oui","Non"].map(x=>`<button class="secondary">${x}</button>`).join("")}</div>`:`<p>Préparez un support personnel : mes signes d'alerte, ce qui m'aide, les personnes à contacter et les adaptations utiles.</p><textarea placeholder="Mes repères"></textarea>`}</div>`}
function startTimer(){let sec=Math.max(1,Number($("#mins").value))*60;let el=$("#timer");function tick(){if(!el)return;el.textContent=Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");if(sec-->0)setTimeout(tick,1000);else el.textContent="Terminé !"}tick()}
function settingsPage(){app.innerHTML=header("Mon espace et mes données","Gérer le code d'accès, exporter ses données et modifier ses profils.")+`<div class="card"><h3>Code à quatre chiffres</h3><p class="muted">Le code sert de verrou d'accès simple sur cet appareil. Il ne chiffre pas les données stockées dans le navigateur.</p><div class="field"><label>Nouveau code (4 chiffres)</label><input id="pin" inputmode="numeric" maxlength="4" placeholder="••••"></div><button onclick="setPin()">Enregistrer le code</button><button class="secondary" onclick="removePin()">Désactiver le code</button></div><div class="card section"><h3>Données personnelles</h3><p class="muted">Les données saisies sont conservées dans le stockage local de ce navigateur. Elles ne sont pas synchronisées entre appareils. Effacer les données du navigateur peut les supprimer.</p><div class="toolbar"><button onclick="exportData()">Exporter mes données</button><label class="quiet" style="padding:10px;border-radius:12px">Importer<input type="file" accept="application/json" onchange="importData(event)" hidden></label><button class="danger" onclick="deleteData()">Tout supprimer</button></div></div><div class="card"><h3>Profils sélectionnés</h3><p>${state.selected.map(p=>`<span class="pill">${p}</span>`).join("")||"Aucun profil"}</p><button class="secondary" onclick="renderProfiles()">Modifier les profils</button></div>`}
function setPin(){let p=$("#pin").value;if(!/^\d{4}$/.test(p))return alert("Saisissez exactement quatre chiffres.");state.pin=p;localStorage.setItem("mosaique_pin",p);alert("Code enregistré sur cet appareil.");settingsPage()}
function removePin(){localStorage.removeItem("mosaique_pin");state.pin="";state.unlocked=true;settingsPage()}
function exportData(){let blob=new Blob([JSON.stringify(state.records,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="mosaique-donnees.json";a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{state.records={...state.records,...JSON.parse(r.result)};save();alert("Import effectué.")}catch{alert("Fichier non reconnu.")}};r.readAsText(f)}
function deleteData(){if(confirm("Supprimer toutes les données enregistrées sur cet appareil ?")){state.records={};save();dashboard()}}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function pinGate(){if(!state.pin||state.unlocked)return false;app.innerHTML=`<section class="hero center"><h1>Code d'accès</h1><p class="sub">Saisissez votre code à quatre chiffres.</p></section><div class="card"><input id="unlockPin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"><button style="width:100%;margin-top:12px" onclick="unlock()">Ouvrir mon espace</button></div>`;return true}
function unlock(){if($("#unlockPin").value===state.pin){state.unlocked=true;home()}else alert("Code incorrect.")}
home();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script></body></html>
